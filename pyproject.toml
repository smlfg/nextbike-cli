[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextbike-cli"
version = "0.1.0"
description = "Live-Verfügbarkeit von nextbike-Leihrädern im Terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "smlfg", email = "186922365+smlfg@users.noreply.github.com"},
]
keywords = ["nextbike", "bike-sharing", "cli", "verkehr", "mobility"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["httpx>=0.24"]

[project.scripts]
nextbike = "nextbike.cli:main"

[project.urls]
Homepage = "https://github.com/smlfg/nextbike-cli"
Repository = "https://github.com/smlfg/nextbike-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
